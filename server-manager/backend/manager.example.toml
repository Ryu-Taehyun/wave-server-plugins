# manager.example.toml 을 manager.toml 로 복사해서 고치세요 (manager.toml 은 저장소에 올리지 않음)

[server]
dir = "/home/mc/server"                                # 서버 폴더 (server.jar 가 있는 곳)
start_command = "java -Xms4G -Xmx8G -jar purpur.jar nogui"
host = "127.0.0.1"                                     # 접속 확인할 주소 · 포트
port = 25565
stop_timeout = 90                                      # 끄기 요청 뒤 이 시간(초) 안에 안 꺼지면 강제 종료
auto_restart = true                                    # 크래시 시 자동 재시작 (10분에 3번까지)

[rcon]                                                 # server.properties: enable-rcon=true, rcon.port, rcon.password
host = "127.0.0.1"
port = 25575
password = ""                                          # 비워 두고 환경 변수 MCM_RCON_PASSWORD 로 넣어도 됨

[web]
host = "0.0.0.0"                                       # 다른 기기(폰 · 노트북)에서 접속
port = 8080
secure_cookies = false                                 # HTTPS(리버스 프록시 · Cloudflare Tunnel) 뒤라면 true
session_days = 14
trusted_proxy = false                                  # 리버스 프록시 뒤라면 true (실제 접속 IP 기록)

[app]
db = "data/manager.db"
sample_seconds = 10
keep_days = 30
