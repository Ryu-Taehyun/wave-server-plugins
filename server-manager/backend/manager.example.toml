# manager.example.toml 을 manager.toml 로 복사해서 고치세요 (manager.toml 은 저장소에 올리지 않음)

[server]
dir = "/home/mc/server"                                # 서버 폴더 (server.jar 가 있는 곳)
start_command = "java -Xms4G -Xmx8G -jar purpur.jar nogui"
host = "127.0.0.1"                                     # 접속 확인할 주소 · 포트
port = 25565
stop_timeout = 90                                      # 끄기 요청 뒤 이 시간(초) 안에 안 꺼지면 강제 종료
auto_restart = true                                    # 크래시 시 자동 재시작 (10분에 3번까지)
# jar = "purpur.jar"                                   # 자동 업데이트할 서버 jar (비우면 start_command 의 -jar 뒤 파일. run.bat 으로 켜면 적어 주세요)

[rcon]                                                 # server.properties: enable-rcon=true, rcon.port, rcon.password
host = "127.0.0.1"
port = 25575
password = ""                                          # 비워 두고 환경 변수 MCM_RCON_PASSWORD 로 넣어도 됨

[web]
host = "0.0.0.0"                                       # 다른 기기(폰 · 노트북)에서 접속
port = 8080
secure_cookies = false                                 # HTTPS(리버스 프록시 · Cloudflare Tunnel) 뒤라면 true
session_days = 14
trusted_proxy = false                                  # 리버스 프록시 뒤라면 true (실제 접속 IP 기록)

[app]
db = "data/manager.db"
sample_seconds = 10
keep_days = 30

[backup]
dir = "data/backups"                                   # 백업 zip 저장 폴더
keep = 7                                               # 자동 백업 보관 개수 (직접 만든 백업 · 복원 전 백업은 따로)
include = ["world", "world_nether", "world_the_end", "plugins", "config", "server.properties", "bukkit.yml", "spigot.yml", "purpur.yml", "ops.json", "whitelist.json", "banned-players.json", "banned-ips.json"]
exclude = ["plugins/*/logs", "plugins/*/backups", "plugins/dynmap/web/tiles", "plugins/BlueMap/web/maps", "*.lock"]
copy_to = ""                                           # 사본을 하나 더 둘 폴더 (외장 디스크 · 클라우드 동기화 폴더)

[notify]
discord_webhook = ""                                   # 디스코드 채널 웹훅 (화면 설정 → 알림 에서도 바꿀 수 있음)
push_contact = "mailto:admin@example.com"              # 웹 푸시 연락처 (형식만 맞으면 됨)

[wave]
plugin_dir = "plugins/WaveCore"                        # WaveCore 데이터 폴더 (서버 폴더 기준)
