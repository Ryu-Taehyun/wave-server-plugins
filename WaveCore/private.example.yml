# 이 파일을 서버의 plugins/WaveCore/private.yml 로 복사해서 실제 값을 채우세요.
# src/main/resources 에 넣어 빌드하면 jar 안에 값이 들어가므로, jar 를 공유할 계획이면 넣지 마세요.
# private.yml 은 저장소 맨 위 .gitignore 로 git 에서 제외됩니다. 여기 있는 값이 config.yml 보다 우선합니다.

# 이 닉네임은 지정한 IP 로만 접속 가능 ("닉네임:IP")
ip-lock:
  - "닉네임:0.0.0.0"

# /report 신고를 받을 관리자 닉네임
report-receivers:
  - "관리자닉네임"

# 밴 화면의 문의처
ban-contact: "discord.gg/초대코드"

links:
  minelist: "https://minelist.kr/servers/..."
  mineboard: "https://www.mineboard.kr/ko/explore/servers/..."
  discord: "https://discord.gg/..."

# 디스코드 관리자 채널 웹훅 주소 (채널 설정 → 연동 → 웹후크 → URL 복사). 이 주소가 새면 누구나 채널에 글을 쓸 수 있으니 공유하지 마세요.
discord-webhook:
  url: "https://discord.com/api/webhooks/..."
