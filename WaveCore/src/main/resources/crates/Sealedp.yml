        </#C8F8FF><#DBFAFF>특</#DBFAFF><#EDFDFF>성</#EDFDFF><white>]
      - <!italic><!underlined><!strikethrough><bold><!obfuscated><dark_gray>>> <!bold><gray>겉날개가
