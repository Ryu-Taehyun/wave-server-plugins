Crate:
  # WaveCore 상자 (CrazyCrates 형식과 같은 항목을 사용합니다)
  CrateType: Wheel
  StartingKeys: 0
  RequiredKeys: 1
  InGUI: true
  # 스페셜 테마 상자(config.yml crate-menu.special-theme)는 스페셜 테마 뽑기 메뉴 안에 자동으로 배치되어 Slot 을 쓰지 않습니다
  Slot: 12
  OpeningBroadCast: true
  Item: moss_block
  Glowing: true
  Name: <gradient:#F5E400:#95FFBE><italic:false><b>The Echoes of Natural</b></gradient>
  Lore:
  - '<gray>오픈 가능한 상자 : <yellow>%keys%'
  - <gray>우클릭하여 상자 구성품을 확인할 수 있습니다
  - ''
  - <gray>좌클릭 시 즉시 오픈됩니다.
  Preview:
    Name: 상자 구성품
    Toggle: true
  Animation:
    Name: The Echoes of Natural
  sound:
    cycle-sound:
      toggle: true
      value: block.note_block.chime
      volume: 1.0
      pitch: 1.0
    stop-sound:
      toggle: true
      value: entity.player.levelup
      volume: 1.0
      pitch: 1.0
  # (WaveCore) 상점에서 '키' 대신 표시할 이름
  Key-Label: 상자 교환권
  PhysicalKey:
    Name: <b><gradient:#F5E400:#95FFBE>[Natural] • The Echoes of Natural 상자 교환권 •</gradient></b>
    Lore:
    - ''
    - <gray>The Echoes of Natural 상자를 1회 오픈할 수 있습니다.
    - <gray>/상자 또는 우클릭하여 상자 메뉴를 열 수 있습니다.
    Item: lime_dye
    Glowing: true
  # Items 대신 Special 을 쓰면 서버 아이템을 지급합니다 (nature_boots, time_shard, quantum_matter, vibranium, altar_ticket)
  # Items 도 Special 도 없으면 DisplayItem / DisplayAmount / DisplayEnchantments 로 만든 아이템을 지급합니다.
  Prizes:
    '1':
      Special: nature_boots
      DisplayItem: diamond_boots
      Weight: 2.0
    '2':
      Special: time_shard
      DisplayItem: glowstone_dust
      DisplayAmount: 2
      Weight: 8.0
    '3':
      Special: quantum_matter
      DisplayItem: yellow_dye
      DisplayAmount: 1
      Weight: 6.0
    '4':
      DisplayItem: enchanted_golden_apple
      DisplayAmount: 1
      Weight: 4.0
    '5':
      DisplayItem: golden_apple
      DisplayAmount: 8
      Weight: 10.0
    '6':
      DisplayItem: emerald_block
      DisplayAmount: 8
      Weight: 10.0
    '7':
      DisplayItem: diamond
      DisplayAmount: 8
      Weight: 8.0
    '8':
      DisplayItem: experience_bottle
      DisplayAmount: 32
      Weight: 12.0
    '9':
      DisplayItem: golden_carrot
      DisplayAmount: 64
      Weight: 12.0
    '10':
      DisplayItem: bone_meal
      DisplayAmount: 64
      Weight: 12.0
