# ==========================================
#        WaveCore (Wave Online) 설정
# ==========================================

# 월드 이름 (Skript 에 하드코딩되어 있던 값)
worlds:
  spawn: "spawn-world"      # 스폰 (신속 V, /spawn, 리스폰)
  wild: "world"             # 야생 (/보호구역, /랜덤스폰)
  nether: "world_nether"
  end: "world_the_end"
  duel: "1v1"               # 1대1 대전 월드
  newbie: "newbie"          # 뉴비 보호 월드

# /spawn, /보호구역 도착 위치는 '/wave setwarp spawn|protect' 로 지정할 수 있습니다.
# 지정하지 않으면 각각 spawn / wild 월드의 스폰으로 이동합니다.

# 1대1 대전 시작 위치 (duel 월드 기준 x, y, z)
duel:
  pos1: [-44.55, -50.0, 32.54]   # 수락한 사람
  pos2: [-44.55, -50.0, 100.0]   # 신청한 사람

# 최대 체력 (20 = 하트 10칸)
health:
  base: 20.0
  # 천공의 심판자 클레이모어 소지 시 추가 체력 (2 = 하트 1칸)
  claymore-bonus: 6.0
  # 프로스트 그레이브 소지 시 추가 체력 (2 = 하트 1칸)
  frost-bonus: 8.0
  # 두 무기를 모두 가지고 있으면 더 큰 값 하나만 적용됩니다. (예: 20 + 8 = 28)
  # 천공의 심판자 클레이모어 소지 시 걷기 속도 (기본 0.2, 0.25 = 25% 증가)
  claymore-walk-speed: 0.25

# 천공의 심판자 클레이모어 '심판의 빛' (타격 시, 쿨타임 30초)
# 황금 충격파 범위 안의 다른 대상에게 실명 + 구속 + 약간의 피해 (범위 피해로는 죽지 않음, 팀원 제외)
weapons:
  # 천공의 심판자 클레이모어
  claymore:
    # 플레이어 타격: 방어구 무시 피해 (20 = 하트 10칸). 남은 체력이 이보다 적으면 min-health 만 남김
    true-damage: 20.0
    min-health: 2.0          # 2 = 하트 1칸. 이미 이 이하라면 일반 공격 데미지로 처치 가능
    # 몬스터 타격 데미지 (0 = 바닐라 금 검 데미지)
    hit-damage: 0
    # 심판의 빛 (번개 + 실명/구속) 추가 고정 피해와 쿨타임. 이 피해로는 죽지 않습니다
    judgment-damage: 6.0
    judgment-cooldown-seconds: 30
  # 잿불 낙인검 (무기 상점): 같은 대상에게 낙인이 min~max 개(무작위) 쌓이면 낙인 폭발
  ember:
    min-stacks: 4
    max-stacks: 7
    window-seconds: 4        # 마지막 적중 후 이 시간이 지나면 낙인이 사라지고 개수를 새로 뽑음
    min-interval-ms: 450     # 이보다 빠른 연타는 낙인이 쌓이지 않음
    burst-damage: 4.0        # 폭발 추가 피해 (4 = 하트 2칸)
    fire-seconds: 3
  # 그림자 사슬 (보조 무기, 예전 Umbral Chain): 들고 때리면 확률적으로 대상을 끌어당기고 묶음
  shade:
    chance: 0.275            # 시간을 가르는 바람과 같은 확률
    pull-strength: 1.1       # 끌어당기는 힘 (거리에 따라 줄어듦)
    bind-seconds: 1.5        # 묶임 (구속) 시간
    slow-level: 3            # 구속 단계
    cooldown-ms: 0           # 0 = 재사용 대기 없음 (확률만)
  # 메아리 종 (보조 무기, 예전 Echo Bell): 들고 때리면 확률적으로 어둠 + 멀미 + 밀쳐내기
  bell:
    chance: 0.275
    darkness-seconds: 2.5
    nausea-seconds: 4
    knockback: 0.9
    cooldown-ms: 0
  # 얼어붙은 제왕의 검: 냉기 연쇄
  sealed:
    crit-chance: 0.20              # 타격 시 데미지 배율이 붙을 확률
    crit-multiplier: 1.3           # 그때 데미지 배율
    chain-damage: 2.0              # 튈 때마다 피해 (2 = 하트 1칸)
    chain-radius: 4                # 다음 대상을 찾는 거리 (칸)
    boost-seconds: 6               # 우클릭 혹한의 연쇄 지속 시간 (이 동안 타격하면 냉기가 튐)
    boost-max: 5                   # 한 번 타격에 냉기가 이어지는 최대 인원
    boost-cooldown-seconds: 40
  # 다크니스 웨이브 2번 스킬 (어둠의 장막)
  darkness-wave:
    veil-seconds: 5
    veil-radius: 3
    veil-cooldown-seconds: 90
  # 재앙의 서막 바지
  ruiner-pants:
    fall-fire-multiplier: 0.5      # 낙하 / 화염 피해 배율 (0.5 = 50% 감소)
    low-health: 0.3                # 체력이 이 비율 이하이면 힘 II
    deny-death-chance: 0.2         # 치명상 시 죽음을 거부하고 체력 절반으로 돌아올 확률
  # 혼돈의 아포칼립스 / 다크니스 웨이브
  chaos:
    damage: 6.5                    # 무기 고정 데미지
    skill-damage: 4.0              # 혼돈의 파열 피해 (4 = 하트 2칸, 이 피해로는 죽지 않음)
    skill-cooldown-seconds: 45
  chaos-helmet:                    # 종말의 투구
    wither-chance: 0.15            # 공격받을 시 공격자에게 위더 I 확률
    wither-seconds: 3
    low-health: 0.3                # 체력이 이 비율 미만일 때
    low-health-reduction: 0.20     # 받는 데미지 감소 비율
  claymore-splash:
    radius: 4.0
    damage: 3.0              # 2 = 하트 1칸
    blindness-seconds: 2.0
    slowness-seconds: 3.0
    slowness-level: 3

# 전투 태그 시간 (초)
combat-time: 12
# 전투 중 진입할 수 없는 WorldGuard 구역 이름
protect-region: "protect"

# / 를 눌렀을 때 일반 플레이어에게 숨길 명령어 (권한이 없는 명령어와 "플러그인:명령어" 는 자동으로 숨김)
hidden-commands: []

# ---- 아래 값들은 실제 서버 값을 private.yml 에 넣습니다 (공개 저장소에 올리지 않음) ----
# private.example.yml 을 private.yml 로 복사해서 채우세요. private.yml 이 config.yml 보다 우선합니다.

# 이 닉네임은 지정한 IP 로만 접속 가능 ("닉네임:IP")
ip-lock: []

# /report 신고를 받을 관리자 닉네임 (wave.report.receive 권한자도 받습니다)
report-receivers: []

# 밴 화면의 문의처
ban-contact: ""

links:
  minelist: ""
  mineboard: ""
  discord: ""

# 디스코드 관리자 채널 알림 (웹훅). 주소는 비밀값이라 반드시 private.yml 에 넣으세요. 비어 있으면 보내지 않습니다.
# events: 보낼 종류 (빼면 그 종류는 안 보냄) report 신고, sanction 제재, refund 환불, paid-cash 유료 캐시 지급, season 시즌 초기화 · 순위 보상, backup 백업 실패, alt 부계정 의심 접속
discord-webhook:
  url: ""
  name: "Wave 서버 알림"
  events: [report, sanction, refund, paid-cash, season, backup, alt]

# 스페셜 상점 (유료 캐시). price-1: 1개, price-10: 10개 묶음
special-shop:
  altar-ticket:
    price-1: 5000
    price-10: 45000
  echoes-voucher:
    crate: "TheEchoesOfNatural"   # plugins/WaveCore/crates/ 의 파일 이름
    price-1: 5000
    price-10: 45000
  chaos-voucher:
    crate: "CatastropheOfChaos"
    price-1: 5000
    price-10: 45000

# 홀짝 도박 (/도박)
gamble:
  min-bet: 1000
  max-bet: 1000000
  daily-bet-limit: 1000000   # 하루 베팅 총액 한도 (홀짝 + 바카라 합산, 0 = 제한 없음). 매일 0시 초기화
  # 도박은 일반 캐시로만 합니다. 유료 캐시는 사용하지 않습니다.

# 바카라 (/바카라). 베팅 범위는 위 gamble 값을 같이 씀
baccarat:
  banker-commission: 0.05   # 뱅커로 이기면 수수료 5% (0.95배)
  tie-payout: 8             # 타이에 걸어 비기면 8배

# 보급 상자 낙하: 일정 시간마다 야생 무작위 좌표에 보급 상자. 먼저 연 사람이 차지 (관리자: /보급 지금 · 정보 · 취소)
supply-drop:
  enabled: true
  interval-minutes: 60       # 몇 분마다
  min-players: 5             # 접속자가 이보다 적으면 건너뜀
  world: "world"             # 떨어지는 월드 (야생)
  min-radius: 300            # 월드 스폰에서 최소 거리
  max-radius: 3000           # 월드 스폰에서 최대 거리 (미리 생성해 둔 범위 안으로)
  despawn-minutes: 15        # 아무도 안 열면 회수
  after-open-seconds: 120    # 처음 연 뒤 이 시간 뒤 회수 (다 비우면 바로 사라짐)
  rolls: 6                   # 보급품 묶음 수 (최대 14). 4줄 창 안쪽에 왼쪽 위부터 순서대로 들어감
  loot:                      # weight 가 클수록 자주 나옴. material 또는 special(서버 아이템) 사용
    - { material: diamond, min: 4, max: 10, weight: 20 }
    - { material: emerald, min: 8, max: 24, weight: 18 }
    - { material: iron_ingot, min: 16, max: 32, weight: 20 }
    - { material: golden_apple, min: 2, max: 6, weight: 15 }
    - { material: ender_pearl, min: 4, max: 12, weight: 15 }
    - { material: experience_bottle, min: 16, max: 32, weight: 15 }
    - { material: netherite_scrap, min: 1, max: 3, weight: 6 }
    - { material: enchanted_golden_apple, min: 1, max: 1, weight: 2 }
    - { special: time_shard, min: 1, max: 2, weight: 5 }
    - { special: quantum_matter, min: 1, max: 1, weight: 3 }

# 채팅 퀴즈 · 타자 대결: 일정 시간마다 문제, 먼저 맞힌 사람에게 일반 캐시 (관리자: /퀴즈 지금 · 취소)
chat-quiz:
  enabled: true
  interval-minutes: 15
  min-players: 3
  time-seconds: 30
  reward-min: 1000
  reward-max: 5000
  words:                     # 타자 대결 문장 (띄어쓰기는 무시하고 비교)
    - "약탈은 빠르게 도망은 더 빠르게"
    - "보급 상자는 먼저 여는 사람이 임자"
    - "오늘도 네더라이트 캐러 갑니다"
    - "혼돈의 아포칼립스"
    - "얼어붙은 제왕의 검"
    - "다이아몬드 곡괭이"
    - "엔더 드래곤을 잡으러 가자"
    - "크리퍼가 뒤에 있어요"
  questions:                 # 상식 문제 (q = 문제, a = 정답)
    - { q: "엔더맨이 싫어하는 액체는?", a: "물" }
    - { q: "네더라이트 주괴를 만드는 데 필요한 고대 잔해 수는?", a: "4" }
    - { q: "크리퍼를 죽이면 떨어지는 아이템은?", a: "화약" }
    - { q: "불사의 토템을 주는 몹은?", a: "소환사" }
    - { q: "엔더의 눈을 만드는 데 필요한 두 아이템 중 엔더 진주가 아닌 것은?", a: "블레이즈 가루" }

# 스킬 사용 제한 (우클릭 스킬: 혼돈의 아포칼립스, 다크니스 웨이브, 얼어붙은 제왕의 검, 이터널 크로노스, 초승달의 서약)
skills:
  block-in-spawn: true          # 스폰 월드(worlds.spawn)에서 금지
  blocked-regions:              # 이 WorldGuard 구역 안에서 금지 (비우면 protect-region 값 사용)
    - "protect"
  block-where-pvp-denied: true  # WorldGuard 로 PvP 가 막힌 곳에서도 금지

# 시즌 초기화 (/시즌 초기화 -> 미리보기, 60초 안에 /시즌 초기화 확인 -> 실행)
# 실행 전에 plugins/WaveCore/backups/season-날짜.zip 으로 전체 백업을 만들고, logs/season-reset.log 에 기록합니다.
# true = 초기화, false = 유지
season-reset:
  number: 1            # 지금 시즌 번호. /시즌 초기화 때마다 1 올라갑니다 (순위 칭호 · 트로피의 "SN", 예: S7)
  money: true          # 일반 캐시 (보유 · 누적)
  exmoney: false       # 유료 캐시 (보유 · 누적 · 랭크 진행). 결제한 금액이므로 보통 false
  level: true          # 레벨 · 경험치
  inventories: true    # 인벤토리 · 엔더 상자 · 바닐라 경험치 · 사망 보관 아이템 (접속 중이면 바로, 아니면 다음 접속 때)
  market: true         # 장터 매물 (판매자 우편함으로 돌려줌)
  collections: false   # 컬렉션 수집 · 보상 수령 기록
  backpack: true       # 배낭(개인 창고)
  team-storage: true   # 팀 창고
  # 시즌 유지 아이템(설명에 "시즌이 지나도" 가 있는 것)은 위에서 지우는 곳 전부와 그 안의 셜커 상자 · 꾸러미까지 찾아
  # 다음 시즌 첫 접속 때 배낭으로 넣어 줍니다 (배낭이 차면 우편함). 팀 창고의 것은 팀 마스터에게.
  # 맵 초기화로 월드의 플레이어 데이터가 없어져도, 마지막 사본으로 첫 접속 때 배낭에 넣어 줍니다.
  bet-limit: true      # 오늘 도박 베팅 누적
  kills: true          # 처치 수 (순위). 지우기 전 순위로 TOP 10 보상을 먼저 줍니다 (ranking.reward-on-season-reset)
  commands: []         # 초기화 뒤 콘솔에서 실행할 명령어. 예: ["passadmin season next 시즌 7"]

# 상자 잠금 (점검): /상자 잠금 <상자> [사유] 로 잠그면 여기에 저장되고, /상자 해제 <상자> 로 풉니다.
# 잠긴 상자는 열 수 없고 상점의 교환권 판매도 멈춥니다. 플레이어가 가진 키는 그대로 남습니다.
crate-locks: {}

# 아이템 뽑기 메뉴: 아래 상자들은 '스페셜 테마 뽑기' 칸 안에 따로 모아 보여줍니다
crate-menu:
  special-theme:
    - "TheEchoesOfNatural"
    - "CatastropheOfChaos"
  special-theme-slot: 13   # 아이템 뽑기 메뉴에서 '스페셜 테마 뽑기' 버튼 칸

# 프리미엄 패스 (PremiumPass 연동, 유료 캐시 상점)
premium-pass:
  voucher-price: 25000     # 프리미엄 패스권 1장
  level-price: 1750        # 패스 레벨 1당

# 오버 로드: Peerless 랭크 달성 후, 누적 유료 캐시가 start 를 넘은 만큼 per-insignia 마다 휘장 1개 (최대 10)
overlord:
  start: 200000
  per-insignia: 75000

# 튜토리얼 (첫 접속 플레이어에게 자동 시작, /튜토리얼)
tutorial:
  enabled: true
  reward-cash: 30000
  reward-newbie-package: true
  reward-altar-tickets: 0

# 주기 공지 (돌아가며 하나씩, 클릭 버튼 포함). /공지테스트 로 바로 다음 공지를 보낼 수 있습니다.
announcements:
  enabled: true
  interval-minutes: 15
  sound: true
  # 순서와 사용 여부: menu, boss, pass, dailyshop, rules, vote, discord (빼면 안 나옴)
  order: [menu, boss, pass, dailyshop, rules, vote, discord]
  # 직접 추가하는 공지 (order 다음에 나옴)
  # - {tag: "&b&l[ 이벤트 ]", title: "&f주말 이벤트 진행 중!", lines: ["&7토~일 경험치 2배"], button: "[자세히]", command: "/도움말"}
  custom: []
  # /공지 예약 · /공지 매일 로 만든 예약 공지 (명령어로 관리, 직접 고치지 않아도 됨)
  scheduled: []

# 제재 (/경고 /임시밴 /뮤트). 누적 경고 수가 count 에 닿으면 자동 처벌
# action: mute(채팅 금지) · tempban(임시 차단) · ban(영구 차단), duration: 30m 1h 1d 7d 1w
sanctions:
  warn-actions:
    - {count: 3, action: mute, duration: 1h}
    - {count: 5, action: tempban, duration: 1d}
    - {count: 7, action: tempban, duration: 7d}
    - {count: 10, action: ban, duration: 영구}

# 채팅 필터 (관리자는 적용 안 됨). 귓속말에도 금지어 · 광고 · 채팅 금지가 적용됩니다.
chat-filter:
  enabled: true
  # 금지어: 가운데 띄어쓰기 · 기호를 넣어도 * 로 가립니다
  bad-words: []
  # IP · 다른 서버 주소(.kr .com .gg 등) 막기. links 의 우리 서버 주소와 allowed-domains 는 허용
  block-ads: true
  allowed-domains: []
  # 채팅 간격(밀리초)과 같은 말 반복 허용 횟수 (15초 안)
  min-interval-ms: 700
  same-message-limit: 2

# 매일 자동 백업 (playerdata + global.yml + config.yml -> backups/daily-날짜.zip). /백업 으로 바로 백업
backup:
  enabled: true
  time: "05:00"
  keep-days: 14

# 부계정(차단 우회) 감지: 차단된 계정과 같은 곳(인터넷 주소)에서 다른 계정이 접속하면
# action: alert (관리자 · 디스코드 알림만) / block (접속도 막음). 가족 · PC방도 같은 곳으로 보일 수 있어 기본은 alert
# allow: 감지에서 빼 줄 닉네임 (확인된 가족 계정 등). 주소는 해시로만 저장됩니다 (plugins/WaveCore/alts.yml)
alt-guard:
  enabled: true
  action: alert
  allow: []

# 순위 (/순위): 돈 · 처치, 1 ~ size 위
# exclude: 순위에서 뺄 닉네임 (관리자 계정 등). 차단 중인 계정은 자동으로 빠짐
# 처치 수는 같은 곳(부계정)끼리 · 같은 상대를 10분 안에 다시 처치한 것은 세지 않음
ranking:
  size: 200
  update-seconds: 60
  exclude: []
  # TOP 10 이 접속하면 "[👑 돈 TOP 1] 닉네임 님이 입장했습니다!" (1위 반짝임 · 효과음, 2 · 3위 효과음, 여러 분야면 가장 높은 순위)
  join-message: true
  # 시즌 초기화(/시즌 초기화) 때 TOP 10 에게 자동 지급. 아니면 /순위 보상 으로 직접
  reward-on-season-reset: true
  # 트로피 · 순위 칭호에 새길 시즌 이름. 비우면 "SN" (N = season-reset.number, 예: S7). 직접 쓰면 그 글자 그대로
  season-name: ""
  # 순위 범위별 보상 (트로피는 항상 우편함으로). money: 캐시, keys: {상자ID: 개수}, commands: {player} {rank} {category}
  rewards:
    "1":
      money: 1000000
      keys: {}
      commands: []
    "2-3":
      money: 500000
      keys: {}
      commands: []
    "4-10":
      money: 200000
      keys: {}
      commands: []

# 출석 보상: 하루 첫 접속 때 자동 출석. 1~7일차 보상(원), 7일마다 반복. 7일 연속이면 칭호 "파수꾼"
attendance:
  enabled: true
  rewards: [1000, 2000, 3000, 4000, 5000, 6000, 10000]

# 업적 (/업적): 기록을 쌓아 단계마다 캐시 보상, 마지막 단계는 업적 칭호. 기록은 시즌 초기화와 상관없이 유지
# reward-multiplier: 업적 캐시 보상 배율 (0.5 = 절반), broadcast: 마지막 단계 달성 시 전체 공지
achievements:
  enabled: true
  reward-multiplier: 1.0
  broadcast: true

# 핫타임: 정해진 시간 동안 보상 배율. 시작 전 알림 · 보스바로 남은 시간 표시
# schedule: "시작 길이(분)" 매일, 앞에 요일을 붙이면 그 요일만 ("토,일 14:00 120", "평일 21:00 30", "주말 ...")
# boost: 배율을 적용할 항목 (false 면 그 항목은 그대로)
# /핫타임 : 상태 · 일정, 관리자 /핫타임 시작 <분> [배율] · /핫타임 종료
hot-time:
  enabled: true
  timezone: "Asia/Seoul"
  multiplier: 2.0
  schedule:
    - "20:00 60"
    - "주말 14:00 60"
  notice-minutes: [10, 5, 1]
  boost:
    level-exp: true
    pass-xp: true
    sell: true
    quiz: true

# 스폰 경험치 구역 (20초 머물면 경험치 10~50)
xp-zone:
  enabled: true
  world: "spawn-world"
  min: [-109, 107, -137]
  max: [-100, 113, -127]
  seconds: 20
  min-xp: 10
  max-xp: 50

# 보스 '천공의 심판자' (천공의 제단 sky_altar.schem 에서만 스폰)
boss:
  enabled: true
  # 제단 위치: 붙여넣은 제단 중앙에 서서 /wave boss setcenter 로 자동 설정
  world: ""
  center: []
  # 보스가 제단 중심에서 벗어날 수 있는 거리 (넘으면 중심으로 귀환)
  radius: 22
  # 처치(또는 시간 초과) 후 다음 강림까지 (분). 시간이 되면 플레이어가 없어도 강림
  respawn-minutes: 30
  health: 400.0
  damage: 12.0
  judgment-damage: 8.0     # 심판의 빛 (예고 1.5초 후 번개)
  wave-damage: 4.0         # 천공의 파동 (넉백)
  exp: 500
  # 이동권 도착 지점: 서서 /wave boss setentry. 비워두면 제단 남쪽 입구
  entry: []
  # 이동은 이동권 우클릭 -> 천공의 제단 메뉴 -> 이동 클릭 으로만 가능 (1회용, 관리자도 소모)
  # /천공의제단 은 메뉴만 엽니다. 보스가 강림한 동안에만 이동할 수 있습니다.
  # 이동권 지급: /wave boss ticket <플레이어> [개수]
  # 보스 전투 제한 시간 (분). 지나면 보스가 사라지고 제단 안 플레이어는 이전 위치로 이동
  fight-minutes: 5
  # 주사위 분배 제한 시간 (초). 분배가 끝날 때까지 전리품 창은 닫을 수 없습니다.
  roll-seconds: 30
  # 처치 후 이 시간(초)이 지나면 자동으로 이전 위치(제단에 오기 전 위치, 없으면 스폰)로 이동
  return-seconds: 60
  # 주사위를 모두 돌렸으면 이 시간(초) 뒤 이동
  return-after-roll-seconds: 10
  # 천공 월드: 이 월드에서는 채팅을 제외한 모든 명령어가 항상 막히고 (관리자 제외),
  # 월드 전체가 제단 구역으로 취급됩니다 (귀환 대상, 이동 제한)
  lock-world: "sky"
  # (제단을 다른 월드에 붙여넣은 경우) 이 범위(제단 중심 기준) 안에서는 전투/분배 중 명령어와 텔레포트가 막힙니다 (관리자 제외)
  arena-radius: 48
  # 그래도 허용할 명령어 (/루팅 은 항상 허용)
  allowed-commands: []
  # 처치할 때마다 3줄(27칸) 창에 전리품이 무작위 위치로 나옵니다.
  # 아이템마다 좌클릭 = 주사위(0~100), 우클릭 = 포기. 혼자면 좌클릭 즉시 획득.
  loot:
    items: 5
    # 천공의 심판자 클레이모어가 전리품에 섞일 확률 (%)
    claymore-chance: 0.5
    # material: 아이템 / special: quantum_matter, vibranium, time_shard, mending_book, altar_ticket
    # min~max: 개수, weight: 뽑힐 비중 (클수록 자주)
    pool:
      - {material: DIAMOND, min: 4, max: 10, weight: 20}
      - {material: GOLD_BLOCK, min: 4, max: 8, weight: 20}
      - {material: EXPERIENCE_BOTTLE, min: 16, max: 48, weight: 20}
      - {material: EMERALD_BLOCK, min: 2, max: 5, weight: 15}
      - {material: GOLDEN_APPLE, min: 3, max: 6, weight: 15}
      - {material: NETHERITE_SCRAP, min: 1, max: 3, weight: 10}
      - {material: ANCIENT_DEBRIS, min: 1, max: 2, weight: 8}
      - {material: TOTEM_OF_UNDYING, min: 1, max: 1, weight: 6}
      - {special: quantum_matter, min: 1, max: 3, weight: 8}
      - {special: time_shard, min: 2, max: 5, weight: 8}
      - {material: ENCHANTED_GOLDEN_APPLE, min: 1, max: 1, weight: 4}
      - {special: mending_book, min: 1, max: 1, weight: 4}
      - {material: NETHERITE_INGOT, min: 1, max: 1, weight: 2}
