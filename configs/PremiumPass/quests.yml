# ==========================================
#          프리미엄 패스 퀘스트 설정
# ==========================================
# type 목록:
#   BREAK_BLOCK   블록 부수기 (직접 설치한 블록은 제외, 농작물은 다 자란 것만 인정)
#   PLACE_BLOCK   블록 설치
#   KILL_MOB      몹 처치 (targets 에 HOSTILE 을 쓰면 모든 적대 몹)
#   FISH          낚시로 아이템 낚기
#   CRAFT         아이템 제작
#   SMELT         화로/훈연기/용광로에서 결과물 꺼내기
#   ENCHANT       마법부여대로 마법부여
#   BREED         동물 번식
#   CONSUME       음식/물약 섭취
#   PLAYTIME      접속 시간 (분, 잠수 시 제외)
#   COMPLETE_DAILY 일일 퀘스트 완료 횟수 (시즌 퀘스트용)
#
# targets: 블록/아이템/엔티티 이름 목록. 비우거나 ANY 면 전부 인정.
#          * 와일드카드 지원 (예: "*_LOG", "COOKED_*")
# amount : 목표 수량
# xp     : 완료 시 패스 XP (최대 레벨 이후엔 포인트로 자동 전환)
# points : 완료 시 즉시 지급되는 프리미엄 패스 포인트
# icon   : GUI 에 표시될 아이템

