# ── 야생 약탈 서버 최적화 (Purpur 1.21.11) ──
# 경로: 서버폴더/config/paper-global.yml
# !! 덮어쓰지 마세요 !!  파일 맨 위의 _version 값이 지워지면 설정이 꼬일 수 있습니다.
# 기존 파일에서 아래 항목을 찾아 값만 바꿔 주세요. (없는 항목은 그 위치에 추가)

chunk-loading-basic:
  autoconfig-send-distance: true
  player-max-chunk-generate-rate: 40.0   # 플레이어 1명이 1초에 새로 만드는 청크 수 (기본 -1 = 무제한)
  player-max-chunk-load-rate: 100.0
  player-max-chunk-send-rate: 75.0

chunk-system:
  gen-parallelism: default
  io-threads: -1
  worker-threads: -1                     # 자동 (6코어면 3개 정도)

misc:
  max-joins-per-tick: 5                  # 재시작 직후 한꺼번에 접속할 때 렉 방지

item-validation:
  book-size:
    page-max: 2560
    total-multiplier: 0.98

packet-limiter:
  all-packets:
    action: KICK
    interval: 7.0
    max-packet-rate: 500.0
