name: PremiumPass
version: '1.0.0'
main: com.premiumpass.PremiumPass
api-version: '1.21'
description: 야생 서버용 프리미엄 패스 (배틀패스) 시스템
commands:
  pass:
    description: 프리미엄 패스 메뉴를 엽니다.
    usage: /pass [보상|일일|시즌|상점|정보|모두수령]
    aliases: [패스, 프리미엄패스]
    permission: premiumpass.use
  passadmin:
    description: 프리미엄 패스 관리 명령어
    usage: /passadmin help
    aliases: [패스관리]
    permission: premiumpass.admin
permissions:
  premiumpass.use:
    description: 프리미엄 패스 사용
    default: true
  premiumpass.premium:
    description: 프리미엄 패스 보유로 취급 (등급 연동용)
    default: false
  premiumpass.admin:
    description: 프리미엄 패스 관리
    default: op
